name: Verify CareInOne Web
on:
  push:
    paths: ['web/**', 'backend/**', '.github/workflows/web.yml', 'deploy/web-render.yaml']
  pull_request:
    paths: ['web/**', 'backend/**', '.github/workflows/web.yml', 'deploy/web-render.yaml']
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.lock
      - run: npm --prefix web ci --omit=optional --ignore-scripts
      - run: npm --prefix web run build
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - run: python -m unittest discover -s web/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s backend/tests -v
      - run: python web/scripts/http_smoke.py
      - run: python web/scripts/http_smoke.py --local-only
      - run: python web/scripts/http_smoke.py --public
      - run: npm --prefix web audit --omit=dev --audit-level=high
      - run: docker build -f web/Dockerfile -t careinone-web:test .
      - run: python web/scripts/container_smoke.py careinone-web:test
      - run: python web/scripts/container_smoke.py careinone-web:test --local-only
      - run: python web/scripts/container_smoke.py careinone-web:test --public
