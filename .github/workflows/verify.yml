name: Verify CareContinuity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift engine tests
        run: swift test
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked runtime
        run: python -m pip install -r backend/requirements.lock
      - name: Schema and security tests
        run: python -m unittest discover -s backend/tests -v
      - name: Repository release preflight
        run: python scripts/release_preflight.py
      - name: Actual HTTP smoke test
        run: python scripts/backend_smoke.py
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[d for runtime,items in data['devices'].items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          if not devices: raise SystemExit('An iOS simulator runtime must be installed on the runner')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CARE_SIMULATOR_ID='+devices[-1]['udid']+'\n')
          PY
      - name: Native integration and UI tests
        run: xcodebuild -project CareContinuity.xcodeproj -scheme CareContinuity -destination "platform=iOS Simulator,id=$CARE_SIMULATOR_ID" -parallel-testing-enabled NO -jobs 2 test
